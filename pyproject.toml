[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mat-summarize"
version = "0.0.1"
authors = [
    { name = "Jonathan Roberto Fragoso Bonatto", email = "jonrfbonatto@gmail.com" },
    { name = "Vanessa Lago Machado", email = "vanessalagomachado@gmail.com" }
]
description = "A package of methods to summarize MATs"
readme = "README.md"
requires-python = ">=3.9"
classifiers = []
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14"
]

[project.urls]
Homepage = "https://github.com/RepresentantativeMAT/mat-summarization"
Issues = "https://github.com/RepresentantativeMAT/mat-summarization/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_summarization"]