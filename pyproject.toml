[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mat-summarize"
version = "0.1.0"
authors = [
    { name = "Vanessa Lago Machado", email = "vanessalagomachado@gmail.com" },
    { name = "Jonathan Roberto Fragoso Bonatto", email = "jonathanrfbonatto@gmail.com" },
]
maintainers = [
    { name = "Vanessa Lago Machado", email = "vanessalagomachado@gmail.com" },
    { name = "Jonathan Roberto Fragoso Bonatto", email = "jonathanrfbonatto@gmail.com" },
]
description = "A package of methods to summarize MATs"
keywords = ["MAT", "summarization", "summarize", "trajectory"]
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14"
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]

[project.urls]
issues = "https://github.com/RepresentantativeMAT/mat-summarization/issues"
source = "https://github.com/RepresentantativeMAT/mat-summarization"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_summarize"]